# ──────────────────────────────────────────────────────────────────────────────
# DAILY FIRESTORE BACKUP (P2 SECURITY FIX)
# ──────────────────────────────────────────────────────────────────────────────
# Exports the entire Firestore database to a Cloud Storage bucket every day at
# 03:30 UTC, retaining the last 30 daily exports (managed by GCS lifecycle —
# see the bucket setup notes below).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_PROJECT_ID    — your Firebase / GCP project id (e.g. qrguard-prod)
#   GCP_SA_KEY             — JSON key for a service account that has the role
#                            `roles/datastore.importExportAdmin` AND can write
#                            to the destination bucket (`roles/storage.admin`
#                            on the bucket is the simplest scope).
#   FIRESTORE_BACKUP_BUCKET — `gs://...` bucket URI (must be in the same
#                             location/region as Firestore).
#
# One-time bucket setup (run locally, replacing PROJECT and REGION):
#   gcloud storage buckets create gs://PROJECT-firestore-backups \
#     --location=REGION --uniform-bucket-level-access
#   gcloud storage buckets update gs://PROJECT-firestore-backups \
#     --lifecycle-file=- <<EOF
#   {"lifecycle":{"rule":[{"action":{"type":"Delete"},
#     "condition":{"age":30}}]}}
#   EOF
#
# Restoring (manual, when needed):
#   gcloud firestore import gs://PROJECT-firestore-backups/<EXPORT_PATH>
# ──────────────────────────────────────────────────────────────────────────────

name: Daily Firestore Backup

on:
  schedule:
    # 03:30 UTC every day (low-traffic window)
    - cron: "30 3 * * *"
  workflow_dispatch: {} # allow manual triggers from the Actions tab

permissions:
  contents: read

concurrency:
  group: firestore-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export Firestore to GCS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Compute timestamped export prefix
        id: ts
        run: echo "prefix=$(date -u +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Export Firestore
        run: |
          set -euo pipefail
          DEST="${{ secrets.FIRESTORE_BACKUP_BUCKET }}/${{ steps.ts.outputs.prefix }}"
          echo "Exporting Firestore to: $DEST"
          gcloud firestore export "$DEST" \
            --project="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --async=false

      - name: Verify export landed in bucket
        run: |
          set -euo pipefail
          DEST="${{ secrets.FIRESTORE_BACKUP_BUCKET }}/${{ steps.ts.outputs.prefix }}"
          echo "Listing $DEST ..."
          gcloud storage ls "$DEST/**" | head -20
          echo "Backup completed successfully."
